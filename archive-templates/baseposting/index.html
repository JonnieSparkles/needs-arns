<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#baseposting Archive</title>
  <meta name="description" content="Baseposts, preserved by baseposters.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="#baseposting Archive" id="og-title">
  <meta property="og:description" content="Baseposts, preserved by baseposters." id="og-description">
  <meta property="og:site_name" content="NeedsArNS">
  <meta property="og:url" content="https://baseposting.ar.io">
  <meta property="og:image" content="https://splash_baseposting.ar.io">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@NeedsArNS">
  <meta name="twitter:title" content="#baseposting Archive" id="twitter-title">
  <meta name="twitter:description" content="Baseposts, preserved by baseposters." id="twitter-description">
  <meta name="twitter:image" content="https://splash_baseposting.ar.io">

  <link rel="icon" type="image/webp" href="base-favicon.webp">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 24px 0 16px 0;
      border-bottom: 1px solid #2f3336;
      margin-bottom: 0;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .header .tagline {
      color: #71767a;
      font-size: 15px;
      margin-top: 12px;
    }

    .header .follow-link {
      display: inline-block;
      margin-top: 12px;
      color: #1d9bf0;
      text-decoration: none;
      font-size: 14px;
    }

    .header .follow-link:hover {
      text-decoration: underline;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 40px;
      color: #71767a;
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid #2f3336;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error state */
    .error {
      text-align: center;
      padding: 40px;
      color: #f4212e;
    }

    /* Post list */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      background-color: #000000;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .post-card:hover {
      background-color: #080808;
    }

    .post-card .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .post-card .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #2f3336;
    }

    .post-card .post-user {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .post-card .post-username {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }

    .post-card .post-invoker {
      font-size: 13px;
      color: #71767a;
    }

    .post-card .post-date {
      font-size: 13px;
      color: #71767a;
    }

    .post-card .post-text {
      font-size: 15px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .post-card .post-media {
      margin-bottom: 12px;
      border-radius: 16px;
      overflow: hidden;
      background-color: #16181c;
    }

    .post-card .post-media img,
    .post-card .post-media video {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      display: block;
    }

    .post-card .post-media .media-error {
      padding: 40px;
      text-align: center;
      color: #71767a;
      font-size: 14px;
    }

    .post-card .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #2f3336;
    }

    .post-card .post-meta-item {
      font-size: 13px;
      color: #71767a;
    }

    .post-card .post-view-link {
      font-size: 13px;
      color: #1d9bf0;
      font-weight: 500;
    }

    /* Load more button */
    .load-more-container {
      text-align: center;
      padding: 24px 16px;
    }

    .load-more-btn {
      background-color: transparent;
      color: #1d9bf0;
      border: 1px solid #1d9bf0;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .load-more-btn:hover {
      background-color: rgba(29, 155, 240, 0.1);
    }

    .load-more-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading-batch {
      text-align: center;
      padding: 20px;
      color: #71767a;
      font-size: 14px;
    }

    /* Stats */
    .stats {
      text-align: center;
      padding: 12px 16px;
      color: #71767a;
      font-size: 14px;
      border-bottom: 1px solid #2f3336;
      margin-bottom: 16px;
    }

    /* Leaderboard */
    .leaderboard {
      background-color: #000000;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .leaderboard h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #ffffff;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #2f3336;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .leaderboard-rank {
      font-size: 14px;
      font-weight: 700;
      color: #71767a;
      min-width: 24px;
      text-align: right;
      margin-right: 12px;
    }

    .leaderboard-rank.top-1 { color: #ffd700; }
    .leaderboard-rank.top-2 { color: #c0c0c0; }
    .leaderboard-rank.top-3 { color: #cd7f32; }

    .leaderboard-username {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .leaderboard-count {
      font-size: 13px;
      color: #71767a;
      font-weight: 600;
      margin-left: 8px;
    }

    .leaderboard-item {
      cursor: pointer;
      transition: background-color 0.2s;
      margin: 0 -8px;
      padding: 10px 8px;
      border-radius: 8px;
    }

    .leaderboard-item:hover {
      background-color: #16181c;
    }

    .leaderboard-item.active {
      background-color: #1d3a4d;
    }

    /* Filter indicator */
    .filter-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: #1d3a4d;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .filter-indicator span {
      font-size: 14px;
      color: #ffffff;
    }

    .filter-clear-btn {
      background: none;
      border: 1px solid #1d9bf0;
      color: #1d9bf0;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-clear-btn:hover {
      background-color: rgba(29, 155, 240, 0.1);
    }

    /* Back button */
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: none;
      border: 1px solid #2f3336;
      border-radius: 20px;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background-color 0.2s;
    }

    .back-button:hover {
      background-color: #181818;
    }

    /* Single post view */
    .single-post {
      display: none;
    }

    .single-post.active {
      display: block;
    }

    .post-list-view {
      display: block;
    }

    .post-list-view.hidden {
      display: none;
    }

    /* Post content */
    .tweet-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .username {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }

    .invoker-info {
      font-size: 13px;
      color: #71767a;
    }

    .date {
      font-size: 15px;
      color: #71767a;
      margin-left: auto;
    }

    .tweet-text {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Media grid */
    .media-grid {
      margin-bottom: 12px;
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      gap: 2px;
    }

    .media-grid.single { grid-template-columns: 1fr; }
    .media-grid.double { grid-template-columns: repeat(2, 1fr); }
    .media-grid.triple { grid-template-columns: repeat(2, 1fr); }
    .media-grid.quad { grid-template-columns: repeat(2, 1fr); }

    .media-item {
      position: relative;
      width: 100%;
      background-color: #000;
      cursor: pointer;
    }

    .media-item.span-full {
      grid-column: 1 / -1;
    }

    .media-item img,
    .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Footer */
    .archive-footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #2f3336;
      font-size: 14px;
      color: #71767a;
      text-align: center;
    }

    .archive-footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    .archive-footer a:hover {
      color: #1d9bf0;
    }

    .request-info {
      margin-top: 12px;
      padding: 12px;
      background-color: #16181c;
      border-radius: 8px;
      font-size: 13px;
    }

    .request-info strong {
      color: #ffffff;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #ffffff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="logo-img" src="baseposting.jpg" alt="#baseposting" onerror="this.style.display='none'">
      <h1>#baseposting</h1>
      <p class="tagline">Baseposts, preserved by baseposters.</p>
      <a class="follow-link" href="https://x.com/baseposting" target="_blank">Follow @baseposting →</a>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Loading archive...</div>
    </div>

    <div class="error" id="error" style="display: none;">
      <div>Failed to load archive</div>
    </div>

    <!-- Post list view -->
    <div class="post-list-view" id="post-list-view" style="display: none;">
      <div class="stats" id="stats"></div>

      <!-- Leaderboard -->
      <div class="leaderboard" id="leaderboard" style="display: none;">
        <h3>🏆 Top Archivists</h3>
        <div class="leaderboard-list" id="leaderboard-list"></div>
      </div>

      <!-- Filter indicator -->
      <div class="filter-indicator" id="filter-indicator" style="display: none;">
        <span id="filter-text">Showing posts by @username</span>
        <button class="filter-clear-btn" onclick="clearFilter()">Show All</button>
      </div>

      <div class="post-list" id="post-list"></div>
      <div class="load-more-container" id="load-more-container" style="display: none;">
        <button class="load-more-btn" id="load-more-btn" onclick="loadMorePosts()">Load More</button>
      </div>
    </div>

    <!-- Single post view -->
    <div class="single-post" id="single-post">
      <button class="back-button" onclick="showPostList()">
        ← Back to all posts
      </button>
      <div id="post-content"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
    <img class="lightbox-content" id="lightbox-img" src="" alt="">
    <video class="lightbox-content" id="lightbox-video" controls style="display: none;">
      <source id="lightbox-video-source" src="" type="video/mp4">
    </video>
  </div>

  <script>
    // State
    let indexData = null;
    let currentPostId = null;
    let currentPage = 0;
    let isLoadingMore = false;
    let filterByUser = null; // Filter posts by invoking username
    const POSTS_PER_PAGE = 10;
    const metadataCache = new Map();

    // ========== Base64URL to Base32 conversion for sandbox subdomains ==========
    const B64_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    const B32_ALPHABET = 'abcdefghijklmnopqrstuvwxyz234567';

    function fromB64Url(b64url) {
      const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
      const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function toB32(bytes) {
      let bits = 0;
      let value = 0;
      let output = '';
      for (let i = 0; i < bytes.length; i++) {
        value = (value << 8) | bytes[i];
        bits += 8;
        while (bits >= 5) {
          output += B32_ALPHABET[(value >>> (bits - 5)) & 31];
          bits -= 5;
        }
      }
      if (bits > 0) {
        output += B32_ALPHABET[(value << (5 - bits)) & 31];
      }
      return output;
    }

    function txToSandbox(txId) {
      return toB32(fromB64Url(txId));
    }

    // ========== Gateway detection ==========
    function getBaseGateway() {
      const hostname = window.location.hostname;
      const parts = hostname.split('.');
      if (parts.length >= 3) {
        return parts.slice(-2).join('.');
      }
      return hostname;
    }

    function getSandboxedUrl(txId) {
      const sandbox = txToSandbox(txId);
      const baseGateway = getBaseGateway();
      return `${window.location.protocol}//${sandbox}.${baseGateway}/${txId}`;
    }

    function getTxUrl(txId) {
      return getSandboxedUrl(txId);
    }

    // ========== Utilities ==========
    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function cleanTweetText(text, entities) {
      if (!text) return '';
      if (!entities || !entities.urls || entities.urls.length === 0) {
        return text;
      }

      let cleanedText = text;

      entities.urls.forEach(urlEntity => {
        const expandedUrl = urlEntity.expanded_url || '';
        const tcoUrl = urlEntity.url;

        const isMediaLink = /\/status\/\d+\/(photo|video)\/\d+/i.test(expandedUrl) ||
                            /^https?:\/\/(pic\.)?x\.com\//i.test(expandedUrl);

        if (isMediaLink) {
          const escaped = tcoUrl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          cleanedText = cleanedText.replace(new RegExp('\\s*' + escaped + '\\s*', 'g'), ' ').trim();
        } else {
          cleanedText = cleanedText.replace(tcoUrl, expandedUrl);
        }
      });

      return cleanedText.replace(/\s+/g, ' ').trim();
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function formatRelativeDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      if (diffHours < 1) return 'Just now';
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // ========== Index loading ==========
    async function loadIndex() {
      try {
        const hostname = window.location.hostname;
        const parts = hostname.split('.');
        const arnsName = parts[0];
        const gateway = parts.slice(1).join('.');
        const indexUrl = `${window.location.protocol}//index_${arnsName}.${gateway}/`;

        console.log('Fetching index from:', indexUrl);
        const response = await fetch(indexUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        indexData = await response.json();

        document.getElementById('loading').style.display = 'none';
        handleHashRoute();

      } catch (error) {
        console.error('Failed to load index:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }

    // ========== Routing ==========
    function handleHashRoute() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#/')) {
        const postId = hash.substring(2);
        if (postId) {
          showPost(postId);
          return;
        }
      }
      showPostList();
    }

    // ========== Post List ==========
    function showPostList() {
      window.location.hash = '';
      currentPostId = null;
      currentPage = 0;

      document.getElementById('post-list-view').style.display = 'block';
      document.getElementById('single-post').classList.remove('active');

      renderPostList(true);
    }

    async function fetchPostMetadata(post) {
      if (metadataCache.has(post.postId)) {
        return metadataCache.get(post.postId);
      }

      try {
        const metadataUrl = getTxUrl(post.metadataTxId);
        const response = await fetch(metadataUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const metadata = await response.json();
        const tweet = metadata.rawApiResponse?.tweet || {};
        const archive = metadata.archive || {};
        const display = metadata.display || {};
        const entities = tweet.entities || null;

        const rawText = tweet.text || post.text || '';
        const cleanedText = cleanTweetText(rawText, entities);

        const result = {
          text: cleanedText,
          media: archive.media || [],
          createdAt: tweet.created_at || post.createdAt,
          username: display.username || post.authorUsername,
          displayName: display.displayName,
          invokingUsername: display.invokingUsername || post.invokingUsername,
          invokingDisplayName: display.invokingDisplayName || post.invokingDisplayName
        };

        metadataCache.set(post.postId, result);
        return result;
      } catch (error) {
        console.error(`Failed to fetch metadata for ${post.postId}:`, error);
        return {
          text: post.text || 'Content unavailable',
          media: [],
          createdAt: post.createdAt,
          username: post.authorUsername,
          invokingUsername: post.invokingUsername
        };
      }
    }

    function renderPostCard(post, metadata) {
      const authorUsername = metadata.username || post.authorUsername || 'unknown';
      const invokingUsername = metadata.invokingUsername || post.invokingUsername;
      const profileImage = post.authorProfileImage;
      const text = metadata.text || '';
      const hasMedia = metadata.media && metadata.media.length > 0;
      const firstMedia = hasMedia ? metadata.media[0] : null;

      let mediaPreviewHtml = '';
      if (firstMedia) {
        const mediaSrc = getTxUrl(firstMedia.txId);
        if (firstMedia.type === 'video' || firstMedia.type === 'animated_gif') {
          mediaPreviewHtml = `
            <div class="post-media">
              <video src="${mediaSrc}" controls playsinline preload="metadata"
                     onerror="this.parentElement.innerHTML='<div class=\\'media-error\\'>Video unavailable</div>'">
              </video>
            </div>`;
        } else {
          mediaPreviewHtml = `
            <div class="post-media">
              <img src="${mediaSrc}" alt="" loading="lazy"
                   onerror="this.parentElement.innerHTML='<div class=\\'media-error\\'>Image unavailable</div>'">
            </div>`;
        }
      }

      const invokerLine = invokingUsername ? `<span class="post-invoker">Archived by @${escapeHtml(invokingUsername)}</span>` : '';

      const avatarHtml = profileImage
        ? `<img class="post-avatar" src="${profileImage}" alt="" onerror="this.style.display='none'">`
        : `<div class="post-avatar"></div>`;

      return `
        <div class="post-card" onclick="showPost('${post.postId}')">
          <div class="post-header">
            ${avatarHtml}
            <div class="post-user">
              <span class="post-username">@${escapeHtml(authorUsername)}</span>
              ${invokerLine}
            </div>
            <span class="post-date">${formatRelativeDate(post.createdAt)}</span>
          </div>
          <div class="post-text">${escapeHtml(text)}</div>
          ${mediaPreviewHtml}
          <div class="post-footer">
            <span class="post-meta-item">
              ${hasMedia ? `📷 ${metadata.media.length}` : ''}
              ${post.hasVideo ? ' 🎬' : ''}
            </span>
            <span class="post-view-link">View archive →</span>
          </div>
        </div>
      `;
    }

    // ========== Leaderboard ==========
    function renderLeaderboard() {
      if (!indexData || !indexData.posts) return;

      const leaderboardEl = document.getElementById('leaderboard');
      const listEl = document.getElementById('leaderboard-list');

      // Count archives per invoking user
      const userCounts = {};
      for (const post of indexData.posts) {
        const username = post.invokingUsername;
        if (username) {
          userCounts[username] = (userCounts[username] || 0) + 1;
        }
      }

      // Sort by count and take top 10
      const sorted = Object.entries(userCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      if (sorted.length === 0) {
        leaderboardEl.style.display = 'none';
        return;
      }

      let html = '';
      sorted.forEach(([username, count], index) => {
        const rank = index + 1;
        let rankClass = '';
        if (rank === 1) rankClass = 'top-1';
        else if (rank === 2) rankClass = 'top-2';
        else if (rank === 3) rankClass = 'top-3';

        const activeClass = filterByUser === username ? ' active' : '';

        html += `
          <div class="leaderboard-item${activeClass}" onclick="filterByUsername('${escapeHtml(username)}')">
            <span class="leaderboard-rank ${rankClass}">${rank}</span>
            <span class="leaderboard-username">@${escapeHtml(username)}</span>
            <span class="leaderboard-count">${count} ${count === 1 ? 'archive' : 'archives'}</span>
          </div>
        `;
      });

      listEl.innerHTML = html;
      leaderboardEl.style.display = 'block';
    }

    function filterByUsername(username) {
      // Toggle filter if clicking the same user
      if (filterByUser === username) {
        clearFilter();
        return;
      }

      filterByUser = username;
      renderLeaderboard(); // Re-render to show active state
      renderPostList(true);

      // Show filter indicator
      document.getElementById('filter-text').textContent = `Showing posts archived by @${username}`;
      document.getElementById('filter-indicator').style.display = 'flex';
    }

    function clearFilter() {
      filterByUser = null;
      document.getElementById('filter-indicator').style.display = 'none';
      renderLeaderboard(); // Re-render to remove active state
      renderPostList(true);
    }

    async function renderPostList(reset = false) {
      if (!indexData || !indexData.posts) return;

      const listEl = document.getElementById('post-list');
      const statsEl = document.getElementById('stats');
      const loadMoreEl = document.getElementById('load-more-container');

      // Render leaderboard on first render
      if (reset) {
        renderLeaderboard();
      }

      // Filter posts by invoking user if filter is active
      let filteredPosts = indexData.posts;
      if (filterByUser) {
        filteredPosts = indexData.posts.filter(p => p.invokingUsername === filterByUser);
      }

      const sortedPosts = [...filteredPosts].sort((a, b) =>
        new Date(b.createdAt) - new Date(a.createdAt)
      );

      if (sortedPosts.length === 0) {
        const emptyMsg = filterByUser
          ? `No posts archived by @${filterByUser} yet.`
          : 'No posts archived yet. Reply to any tweet with @NeedsArNS #baseposting to archive it!';
        listEl.innerHTML = `<div class="loading">${emptyMsg}</div>`;
        loadMoreEl.style.display = 'none';
        statsEl.textContent = '0 posts archived';
        return;
      }

      if (reset) {
        currentPage = 0;
        listEl.innerHTML = '';
      }

      const startIdx = currentPage * POSTS_PER_PAGE;
      const endIdx = startIdx + POSTS_PER_PAGE;
      const pagePosts = sortedPosts.slice(startIdx, endIdx);
      const hasMore = endIdx < sortedPosts.length;

      const loadingId = `loading-${currentPage}`;
      listEl.innerHTML += `<div id="${loadingId}" class="loading-batch">Loading posts...</div>`;

      for (const post of pagePosts) {
        const metadata = await fetchPostMetadata(post);
        const cardHtml = renderPostCard(post, metadata);
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) {
          loadingEl.insertAdjacentHTML('beforebegin', cardHtml);
        }
      }

      const loadingEl = document.getElementById(loadingId);
      if (loadingEl) loadingEl.remove();

      const statsText = filterByUser
        ? `${sortedPosts.length} of ${indexData.posts.length} posts by @${filterByUser}`
        : `${sortedPosts.length} post${sortedPosts.length !== 1 ? 's' : ''} archived • Last updated ${formatDate(indexData.metadata?.lastUpdated || new Date())}`;
      statsEl.textContent = statsText;

      if (hasMore) {
        loadMoreEl.style.display = 'block';
        const remaining = sortedPosts.length - endIdx;
        document.getElementById('load-more-btn').textContent = `Load More (${remaining} remaining)`;
      } else {
        loadMoreEl.style.display = 'none';
      }

      isLoadingMore = false;
    }

    async function loadMorePosts() {
      if (isLoadingMore) return;
      isLoadingMore = true;

      const btn = document.getElementById('load-more-btn');
      btn.disabled = true;
      btn.textContent = 'Loading...';

      currentPage++;
      await renderPostList(false);

      btn.disabled = false;
    }

    // ========== Single Post View ==========
    async function showPost(postId) {
      window.location.hash = `/${postId}`;
      currentPostId = postId;

      document.getElementById('post-list-view').style.display = 'none';
      document.getElementById('single-post').classList.add('active');

      const contentEl = document.getElementById('post-content');
      contentEl.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading post...</div></div>';

      const postIndex = indexData.posts.find(p => p.postId === postId);
      if (!postIndex || !postIndex.manifestTxId) {
        contentEl.innerHTML = '<div class="error">Post not found</div>';
        return;
      }

      try {
        const metadataUrl = getTxUrl(postIndex.metadataTxId);
        console.log('Fetching metadata from:', metadataUrl);
        const response = await fetch(metadataUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const metadata = await response.json();
        renderSinglePost(metadata, postIndex);

      } catch (error) {
        console.error('Failed to load post:', error);
        contentEl.innerHTML = `<div class="error">Failed to load post: ${error.message}</div>`;
      }
    }

    function renderSinglePost(metadata, postIndex) {
      const tweet = metadata.rawApiResponse?.tweet || {};
      const display = metadata.display || {};
      const archive = metadata.archive || {};
      const metaInfo = metadata.metadata || {};
      const entities = tweet.entities || null;

      const username = display.username || postIndex.authorUsername || 'unknown';
      const invokingUsername = display.invokingUsername || postIndex.invokingUsername;
      const rawText = tweet.text || display.text || '';
      const text = cleanTweetText(rawText, entities);
      const createdAt = tweet.created_at || display.createdAt;

      let mediaHTML = '';
      if (archive.media && archive.media.length > 0) {
        const count = archive.media.length;
        let gridClass = 'single';
        if (count === 2) gridClass = 'double';
        else if (count === 3) gridClass = 'triple';
        else if (count >= 4) gridClass = 'quad';

        const mediaItems = archive.media.slice(0, 4).map((media, index) => {
          const spanFull = (count === 3 && index === 0) ? ' span-full' : '';
          const mediaSrc = getTxUrl(media.txId);

          if (media.type === 'photo' || media.type === 'link') {
            return `<div class="media-item${spanFull}" onclick="openLightbox('${mediaSrc}', 'image')">
              <img src="${mediaSrc}" alt="${escapeHtml(media.alt_text || '')}">
            </div>`;
          } else if (media.type === 'video' || media.type === 'animated_gif') {
            const attrs = media.type === 'animated_gif' ? 'autoplay loop muted playsinline' : 'controls playsinline';
            return `<div class="media-item${spanFull}" onclick="openLightbox('${mediaSrc}', 'video')">
              <video ${attrs}><source src="${mediaSrc}" type="video/mp4"></video>
            </div>`;
          }
          return '';
        }).join('');

        mediaHTML = `<div class="media-grid ${gridClass}">${mediaItems}</div>`;
      }

      const invokerLine = invokingUsername ? `<span class="invoker-info">Archived by @${escapeHtml(invokingUsername)}</span>` : '';

      const html = `
        <div class="tweet-header">
          <div class="user-info">
            <span class="username">@${escapeHtml(username)}</span>
            ${invokerLine}
          </div>
          <span class="date">${formatDate(createdAt)}</span>
        </div>

        <div class="tweet-text">${escapeHtml(text)}</div>

        ${mediaHTML}

        <div class="archive-footer">
          <div><a href="https://x.com/NeedsArNS" target="_blank">@NeedsArNS</a> • <a href="https://ar.io" target="_blank">ar.io</a> + <a href="https://arweave.com" target="_blank">arweave</a></div>
          <div class="request-info">
            <strong>Post ID:</strong> ${postIndex.postId}<br>
            <strong>Author:</strong> <a href="https://x.com/${escapeHtml(username)}" target="_blank">@${escapeHtml(username)}</a><br>
            ${invokingUsername ? `<strong>Archived by:</strong> <a href="https://x.com/${escapeHtml(invokingUsername)}" target="_blank">@${escapeHtml(invokingUsername)}</a><br>` : ''}
            <strong>Archived:</strong> ${formatDate(postIndex.processedAt)}<br>
            <strong>Original:</strong> <a href="https://x.com/${escapeHtml(username)}/status/${postIndex.postId}" target="_blank">View on X</a><br>
            <strong>Manifest:</strong> <a href="https://viewblock.io/arweave/tx/${postIndex.manifestTxId}" target="_blank">${postIndex.manifestTxId.substring(0, 12)}...</a>
          </div>
        </div>
      `;

      document.getElementById('post-content').innerHTML = html;
    }

    // ========== Lightbox ==========
    function openLightbox(src, type) {
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const video = document.getElementById('lightbox-video');
      const videoSource = document.getElementById('lightbox-video-source');

      if (type === 'video') {
        img.style.display = 'none';
        video.style.display = 'block';
        videoSource.src = src;
        video.load();
        video.play().catch(() => {});
      } else {
        video.style.display = 'none';
        img.style.display = 'block';
        img.src = src;
      }

      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(event) {
      if (event.target.classList.contains('lightbox-content')) return;

      const lightbox = document.getElementById('lightbox');
      const video = document.getElementById('lightbox-video');

      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      video.pause();
    }

    // ========== Event Listeners ==========
    window.addEventListener('hashchange', handleHashRoute);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const lightbox = document.getElementById('lightbox');
        if (lightbox.classList.contains('active')) {
          closeLightbox({ target: lightbox });
        } else if (currentPostId) {
          showPostList();
        }
      }
    });

    document.addEventListener('DOMContentLoaded', loadIndex);
  </script>
</body>
</html>
