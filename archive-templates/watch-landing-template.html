<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive</title>
  <meta name="description" content="Permanent archive of posts on Arweave">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Archive" id="og-title">
  <meta property="og:description" content="Permanent archive of posts on Arweave" id="og-description">
  <meta property="og:site_name" content="NeedsArNS Watch">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Archive" id="twitter-title">
  <meta name="twitter:description" content="Permanent archive of posts on Arweave" id="twitter-description">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗄️</text></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 24px 0;
      border-bottom: 1px solid #2f3336;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header .account-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .header .account-info img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .header .tagline {
      color: #71767a;
      font-size: 15px;
      margin-top: 12px;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 40px;
      color: #71767a;
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid #2f3336;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error state */
    .error {
      text-align: center;
      padding: 40px;
      color: #f4212e;
    }

    /* Post list */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      background-color: #000000;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .post-card:hover {
      background-color: #080808;
    }

    .post-card .post-date {
      font-size: 13px;
      color: #71767a;
      margin-bottom: 8px;
    }

    .post-card .post-text {
      font-size: 15px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .post-card .post-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #71767a;
    }

    .post-card .post-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Stats */
    .stats {
      text-align: center;
      padding: 16px;
      color: #71767a;
      font-size: 14px;
      border-top: 1px solid #2f3336;
      margin-top: 24px;
    }

    /* Back button */
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: none;
      border: 1px solid #2f3336;
      border-radius: 20px;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background-color 0.2s;
    }

    .back-button:hover {
      background-color: #181818;
    }

    /* Single post view */
    .single-post {
      display: none;
    }

    .single-post.active {
      display: block;
    }

    .post-list-view {
      display: block;
    }

    .post-list-view.hidden {
      display: none;
    }

    /* Post content (reused from post-archive-template) */
    .tweet-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .username {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }

    .date {
      font-size: 15px;
      color: #71767a;
      margin-left: auto;
    }

    .tweet-text {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Media grid */
    .media-grid {
      margin-bottom: 12px;
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      gap: 2px;
    }

    .media-grid.single { grid-template-columns: 1fr; }
    .media-grid.double { grid-template-columns: repeat(2, 1fr); }
    .media-grid.triple { grid-template-columns: repeat(2, 1fr); }
    .media-grid.quad { grid-template-columns: repeat(2, 1fr); }

    .media-item {
      position: relative;
      width: 100%;
      background-color: #000;
      cursor: pointer;
    }

    .media-item.span-full {
      grid-column: 1 / -1;
    }

    .media-item img,
    .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Footer */
    .archive-footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #2f3336;
      font-size: 14px;
      color: #71767a;
      text-align: center;
    }

    .archive-footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    .archive-footer a:hover {
      color: #1d9bf0;
    }

    .request-info {
      margin-top: 12px;
      padding: 12px;
      background-color: #16181c;
      border-radius: 8px;
      font-size: 13px;
    }

    .request-info strong {
      color: #ffffff;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #ffffff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="page-title">Archive</h1>
      <div class="account-info" id="account-info" style="display: none;">
        <img id="profile-image" src="" alt="Profile">
      </div>
      <p class="tagline" id="tagline"></p>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Loading archive...</div>
    </div>

    <div class="error" id="error" style="display: none;">
      <div>Failed to load archive</div>
    </div>

    <!-- Post list view -->
    <div class="post-list-view" id="post-list-view" style="display: none;">
      <div class="post-list" id="post-list"></div>
      <div class="stats" id="stats"></div>
    </div>

    <!-- Single post view -->
    <div class="single-post" id="single-post">
      <button class="back-button" onclick="showPostList()">
        ← Back to all posts
      </button>
      <div id="post-content"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
    <img class="lightbox-content" id="lightbox-img" src="" alt="">
    <video class="lightbox-content" id="lightbox-video" controls style="display: none;">
      <source id="lightbox-video-source" src="" type="video/mp4">
    </video>
  </div>

  <script>
    // State
    let indexData = null;
    let currentPostId = null;

    // Gateway detection
    function detectGateway() {
      const hostname = window.location.hostname;
      if (hostname.includes('arweave.net')) return 'https://arweave.net';
      if (hostname.includes('.')) {
        const parts = hostname.split('.');
        if (parts.length >= 3) {
          return `${window.location.protocol}//${parts.slice(1).join('.')}`;
        }
        return `${window.location.protocol}//${hostname}`;
      }
      return 'https://arweave.net';
    }

    const arweaveGateway = detectGateway();

    function getMediaGateway() {
      const hostname = window.location.hostname;
      if (hostname.includes('ar.io')) return 'https://arweave.net';
      return arweaveGateway;
    }

    // Escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Format date
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    // Load index from the index_ undername
    async function loadIndex() {
      try {
        // Fetch from index_ undername relative to current gateway
        const hostname = window.location.hostname;
        let indexUrl;

        // Parse hostname: {arnsName}.{gateway} -> index_{arnsName}.{gateway}
        const parts = hostname.split('.');
        const arnsName = parts[0];
        const gateway = parts.slice(1).join('.');
        indexUrl = `${window.location.protocol}//index_${arnsName}.${gateway}/`;

        console.log('Fetching index from:', indexUrl);
        const response = await fetch(indexUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        indexData = await response.json();

        // Update page title and account info
        if (indexData.metadata) {
          const username = indexData.metadata.watchedAccount;
          document.getElementById('page-title').textContent = `@${username} Archive`;
          document.title = `@${username} Archive`;
          document.getElementById('tagline').innerHTML = `What <a href="https://x.com/${username}" target="_blank">@${username}</a> said — archived forever.`;

          // Update meta tags
          document.getElementById('og-title').content = `@${username} Archive`;
          document.getElementById('twitter-title').content = `@${username} Archive`;
        }

        document.getElementById('loading').style.display = 'none';

        // Check for hash route
        handleHashRoute();

      } catch (error) {
        console.error('Failed to load index:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }

    // Handle hash routing
    function handleHashRoute() {
      const hash = window.location.hash;

      if (hash && hash.startsWith('#/')) {
        const postId = hash.substring(2);
        if (postId) {
          showPost(postId);
          return;
        }
      }

      showPostList();
    }

    // Show post list
    function showPostList() {
      window.location.hash = '';
      currentPostId = null;

      document.getElementById('post-list-view').style.display = 'block';
      document.getElementById('single-post').classList.remove('active');

      renderPostList();
    }

    // Render post list
    function renderPostList() {
      if (!indexData || !indexData.posts) return;

      const listEl = document.getElementById('post-list');
      const posts = indexData.posts;

      if (posts.length === 0) {
        listEl.innerHTML = '<div class="loading">No posts archived yet</div>';
        return;
      }

      listEl.innerHTML = posts.map(post => `
        <div class="post-card" onclick="showPost('${post.postId}')">
          <div class="post-date">${formatDate(post.createdAt)}</div>
          <div class="post-text">${escapeHtml(post.text)}</div>
          <div class="post-meta">
            ${post.mediaCount > 0 ? `<span>📷 ${post.mediaCount} media</span>` : ''}
            ${post.hasVideo ? '<span>🎬 Video</span>' : ''}
          </div>
        </div>
      `).join('');

      // Update stats
      document.getElementById('stats').textContent =
        `${posts.length} post${posts.length !== 1 ? 's' : ''} archived • Last updated ${formatDate(indexData.metadata.lastUpdated)}`;
    }

    // Show single post
    async function showPost(postId) {
      window.location.hash = `/${postId}`;
      currentPostId = postId;

      document.getElementById('post-list-view').style.display = 'none';
      document.getElementById('single-post').classList.add('active');

      const contentEl = document.getElementById('post-content');
      contentEl.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading post...</div></div>';

      // Find post in index
      const postIndex = indexData.posts.find(p => p.postId === postId);
      if (!postIndex || !postIndex.manifestTxId) {
        contentEl.innerHTML = '<div class="error">Post not found</div>';
        return;
      }

      try {
        // Fetch metadata from manifest
        const metadataUrl = `${arweaveGateway}/${postIndex.metadataTxId}`;
        const response = await fetch(metadataUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const metadata = await response.json();
        renderSinglePost(metadata, postIndex);

      } catch (error) {
        console.error('Failed to load post:', error);
        contentEl.innerHTML = `<div class="error">Failed to load post: ${error.message}</div>`;
      }
    }

    // Render single post
    function renderSinglePost(metadata, postIndex) {
      const tweet = metadata.rawApiResponse?.tweet || {};
      const display = metadata.display || {};
      const archive = metadata.archive || {};
      const arnsName = metadata.metadata?.arnsName || '';

      const username = display.username || metadata.metadata?.watchedAccount || 'unknown';
      const text = tweet.text || display.text || '';
      const createdAt = tweet.created_at || display.createdAt;

      // Generate media HTML
      let mediaHTML = '';
      if (archive.media && archive.media.length > 0) {
        const count = archive.media.length;
        let gridClass = 'single';
        if (count === 2) gridClass = 'double';
        else if (count === 3) gridClass = 'triple';
        else if (count >= 4) gridClass = 'quad';

        const mediaItems = archive.media.slice(0, 4).map((media, index) => {
          const spanFull = (count === 3 && index === 0) ? ' span-full' : '';
          const mediaSrc = `${getMediaGateway()}/${media.txId}`;

          if (media.type === 'photo' || media.type === 'link') {
            return `<div class="media-item${spanFull}" onclick="openLightbox('${mediaSrc}', 'image')">
              <img src="${mediaSrc}" alt="${escapeHtml(media.alt_text || '')}">
            </div>`;
          } else if (media.type === 'video' || media.type === 'animated_gif') {
            const attrs = media.type === 'animated_gif' ? 'autoplay loop muted playsinline' : 'controls playsinline';
            return `<div class="media-item${spanFull}" onclick="openLightbox('${mediaSrc}', 'video')">
              <video ${attrs}><source src="${mediaSrc}" type="video/mp4"></video>
            </div>`;
          }
          return '';
        }).join('');

        mediaHTML = `<div class="media-grid ${gridClass}">${mediaItems}</div>`;
      }

      const html = `
        <div class="tweet-header">
          <div class="user-info">
            <span class="username">@${escapeHtml(username)}</span>
          </div>
          <span class="date">${formatDate(createdAt)}</span>
        </div>

        <div class="tweet-text">${escapeHtml(text)}</div>

        ${mediaHTML}

        <div class="archive-footer">
          <div><a href="https://x.com/NeedsArNS" target="_blank">@NeedsArNS</a> • <a href="https://ar.io" target="_blank">ar.io</a> + <a href="https://arweave.com" target="_blank">arweave</a></div>
          <div class="request-info">
            <strong>Post ID:</strong> ${postIndex.postId}<br>
            <strong>Archived:</strong> ${formatDate(postIndex.processedAt)}<br>
            <strong>Original:</strong> <a href="https://x.com/${escapeHtml(username)}/status/${postIndex.postId}" target="_blank">View on X</a><br>
            <strong>Manifest:</strong> <a href="https://viewblock.io/arweave/tx/${postIndex.manifestTxId}" target="_blank">${postIndex.manifestTxId.substring(0, 12)}...</a>
          </div>
        </div>
      `;

      document.getElementById('post-content').innerHTML = html;
    }

    // Lightbox functions
    function openLightbox(src, type) {
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const video = document.getElementById('lightbox-video');
      const videoSource = document.getElementById('lightbox-video-source');

      if (type === 'video') {
        img.style.display = 'none';
        video.style.display = 'block';
        videoSource.src = src;
        video.load();
        video.play().catch(() => {});
      } else {
        video.style.display = 'none';
        img.style.display = 'block';
        img.src = src;
      }

      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(event) {
      if (event.target.classList.contains('lightbox-content')) return;

      const lightbox = document.getElementById('lightbox');
      const video = document.getElementById('lightbox-video');

      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      video.pause();
    }

    // Handle hash changes
    window.addEventListener('hashchange', handleHashRoute);

    // Handle escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const lightbox = document.getElementById('lightbox');
        if (lightbox.classList.contains('active')) {
          closeLightbox({ target: lightbox });
        } else if (currentPostId) {
          showPostList();
        }
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', loadIndex);
  </script>
</body>
</html>
