<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeedsArNS Archive - Permanent Twitter Archives on Arweave</title>
    <meta name="description" content="Permanently archived tweets on Arweave via ArNS. Browse the complete archive of archived Twitter content.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NeedsArNS Archive - Permanent Twitter Archives on Arweave">
    <meta property="og:description" content="Permanently archived tweets on Arweave via ArNS. Browse the complete archive of archived Twitter content.">
    <meta property="og:site_name" content="NeedsArNS Archive">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@NeedsArNS">
    <meta name="twitter:title" content="NeedsArNS Archive - Permanent Twitter Archives on Arweave">
    <meta name="twitter:description" content="Permanently archived tweets on Arweave via ArNS. Browse the complete archive of archived Twitter content.">
    
    <!-- Additional SEO -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="NeedsArNS">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #000000;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 16px;
            align-items: start;
        }
        
        .footer-container {
            grid-column: 1 / -1;
        }
        
        .main-content {
            min-width: 0;
        }
        
        .sidebar {
            position: sticky;
            top: 20px;
        }
        
        .header {
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }
        
        .sidebar-card {
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .sidebar-card h3 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #71767a;
            margin-bottom: 1.5rem;
        }
        
        .twitter-link {
            color: #1da1f2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        
        .twitter-link:hover {
            color: #1a91da;
            text-decoration: underline;
        }
        
        /* Stats Section */
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .stat-item {
            padding: 16px;
            border-bottom: 1px solid #2f3336;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-size: 13px;
            color: #71767a;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
        }
        
        .stat-detail {
            font-size: 13px;
            color: #71767a;
            margin-top: 4px;
        }
        
        /* Feed Section */
        .feed-container {
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 16px;
        }
        
        .feed-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2f3336;
        }
        
        .feed-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .feed-header p {
            color: #71767a;
            font-size: 15px;
        }
        
        .feed-item {
            padding: 16px;
            border-bottom: 1px solid #2f3336;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        
        .feed-item:hover {
            background-color: #16181c;
        }
        
        .feed-item:last-child {
            border-bottom: none;
        }
        
        .feed-header-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }
        
        .feed-user-info {
            display: flex;
            flex-direction: column;
        }
        
        .feed-username {
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
        }
        
        .feed-handle {
            font-size: 15px;
            color: #71767a;
        }
        
        .feed-date {
            font-size: 15px;
            color: #71767a;
            margin-left: auto;
        }
        
        .feed-title {
            font-size: 16px;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 12px;
            word-break: break-word;
        }
        
        .feed-media-container {
            margin-bottom: 12px;
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }
        
        .feed-preview {
            width: 100%;
            max-height: 400px;
            border-radius: 0;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        
        .feed-preview img,
        .feed-preview video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        
        .feed-preview-placeholder {
            width: 100%;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #16181c;
            color: #71767a;
            font-size: 3rem;
        }
        
        .feed-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2f3336;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .feed-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: #71767a;
        }
        
        .feed-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .feed-meta-item strong {
            color: #ffffff;
            font-weight: 600;
        }
        
        .feed-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        
        .feed-link {
            font-size: 13px;
            color: #1da1f2;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #2f3336;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-weight: 600;
            background-color: #000000;
        }
        
        .feed-link:hover {
            background-color: #16181c;
            border-color: #1da1f2;
            color: #1da1f2;
        }
        
        .media-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: #16181c;
            color: #71767a;
            border: 1px solid #2f3336;
        }
        
        .media-badge.media {
            background-color: #16181c;
            color: #1da1f2;
            border-color: #1da1f2;
        }
        
        .loading, .error {
            text-align: center;
            padding: 40px;
            color: #71767a;
            font-size: 15px;
        }
        
        .error {
            color: #f4212e;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            padding: 24px;
            color: #71767a;
            font-size: 14px;
        }
        
        .footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
        
        .footer a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
            }
            
            .sidebar-card {
                margin-top: 16px;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            
            .header, .feed-container {
                padding: 16px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .feed-item {
                flex-direction: column;
            }
            
            .feed-preview {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="header">
                <h1>🏛️ NeedsArNS Archive</h1>
                <p class="subtitle">
                    Permanently archived on Arweave • 
                    <a href="https://twitter.com/NeedsArNS" target="_blank" class="twitter-link">@NeedsArNS</a>
                </p>
            </div>
            
            <div class="feed-container">
                <div class="feed-header">
                    <h2>Latest Archives</h2>
                </div>
                
                <div id="feedContainer">
                    <div class="loading">Loading archive...</div>
                </div>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="sidebar-card">
                <h3>Archive Stats</h3>
                <div class="stats-list" id="statsContainer">
                    <div class="stat-item">
                        <div class="stat-label">Total Archives</div>
                        <div class="stat-value" id="statTotal">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Top Archiver</div>
                        <div class="stat-value" id="statTopArchiver">-</div>
                        <div class="stat-detail" id="statTopCount"></div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">With Media</div>
                        <div class="stat-value" id="statMedia">-</div>
                        <div class="stat-detail" id="statMediaPercent"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer-container">
            <div class="footer">
                <p>
                    <a href="https://twitter.com/arnsdomains" target="_blank">Powered by @ArNSdomains</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const fullHostname = window.location.hostname;
        const arnsName = 'needsarns';
        
        // Extract the gateway domain
        let gatewayHost = fullHostname;
        if (fullHostname.startsWith(`${arnsName}.`)) {
            gatewayHost = fullHostname.substring(arnsName.length + 1);
        }
        
        const BOT_CONFIG = {
            arnsName: arnsName,
            gatewayHost: gatewayHost,
            archiveIndexUrl: `https://archive_${arnsName}.${gatewayHost}`
        };
        
        let archiveIndex = null;
        
        // Load archive index
        async function loadArchiveIndex() {
            try {
                console.log('Fetching archive index from:', BOT_CONFIG.archiveIndexUrl);
                const response = await fetch(BOT_CONFIG.archiveIndexUrl);
                
                if (!response.ok) {
                    throw new Error(`Archive index fetch failed: ${response.status}`);
                }
                
                archiveIndex = await response.json();
                console.log('Archive index loaded:', archiveIndex);
                
                // Render stats and feed
                renderStats();
                renderFeed();
                
            } catch (error) {
                console.error('Error fetching archive index:', error);
                
                // Try fallback to ar.io
                if (gatewayHost !== 'ar.io') {
                    console.log('Trying fallback to ar.io...');
                    try {
                        const fallbackUrl = `https://archive_needsarns.ar.io`;
                        const fallbackResponse = await fetch(fallbackUrl);
                        
                        if (fallbackResponse.ok) {
                            archiveIndex = await fallbackResponse.json();
                            renderStats();
                            renderFeed();
                            return;
                        }
                    } catch (fallbackError) {
                        console.error('Fallback also failed:', fallbackError);
                    }
                }
                
                document.getElementById('feedContainer').innerHTML = 
                    '<div class="error">Failed to load archive. Please try again later.</div>';
            }
        }
        
        // Calculate and render stats
        function renderStats() {
            if (!archiveIndex || !archiveIndex.mentions || archiveIndex.mentions.length === 0) {
                // Show zeros if no data
                document.getElementById('statTotal').textContent = '0';
                document.getElementById('statTopArchiver').textContent = '-';
                document.getElementById('statTopCount').textContent = '';
                document.getElementById('statMedia').textContent = '0';
                document.getElementById('statMediaPercent').textContent = '0% of total';
                return;
            }
            
            const mentions = archiveIndex.mentions;
            const total = archiveIndex.metadata?.totalMentions || mentions.length;
            
            // Calculate top archiver
            const archiverCounts = {};
            mentions.forEach(m => {
                const username = m.mentionUsername || 'unknown';
                archiverCounts[username] = (archiverCounts[username] || 0) + 1;
            });
            
            const topArchiver = Object.entries(archiverCounts)
                .sort((a, b) => b[1] - a[1])[0];
            
            // Calculate media stats
            const withMedia = mentions.filter(m => (m.mediaCount || 0) > 0).length;
            const mediaPercent = total > 0 ? Math.round((withMedia / total) * 100) : 0;
            
            // Update DOM
            document.getElementById('statTotal').textContent = total;
            
            if (topArchiver && topArchiver[0] !== 'unknown') {
                document.getElementById('statTopArchiver').textContent = `@${topArchiver[0]}`;
                document.getElementById('statTopCount').textContent = `${topArchiver[1]} archive${topArchiver[1] !== 1 ? 's' : ''}`;
            } else {
                document.getElementById('statTopArchiver').textContent = '-';
                document.getElementById('statTopCount').textContent = '';
            }
            
            document.getElementById('statMedia').textContent = withMedia;
            document.getElementById('statMediaPercent').textContent = `${mediaPercent}% of total`;
        }
        
        // Helper: Fetch manifest and extract metadata TXID
        async function fetchManifestMetadata(manifestTxId) {
            try {
                const manifestUrl = `https://${BOT_CONFIG.gatewayHost}/${manifestTxId}`;
                const manifestResponse = await fetch(manifestUrl, {
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!manifestResponse.ok) {
                    throw new Error(`Manifest fetch failed: ${manifestResponse.status}`);
                }
                
                const manifestData = await manifestResponse.json();
                
                // Check if it's a manifest (has manifest and paths)
                if (manifestData.manifest === 'arweave/paths' && manifestData.paths && manifestData.paths['metadata.json']) {
                    return manifestData.paths['metadata.json'].id;
                }
                
                throw new Error('Invalid manifest format');
            } catch (error) {
                console.error(`Error fetching manifest ${manifestTxId}:`, error);
                return null;
            }
        }
        
        // Helper: Fetch metadata and extract media TXID for preview
        async function getPreviewMediaTxId(metadataTxId) {
            try {
                const metadataUrl = `https://${BOT_CONFIG.gatewayHost}/${metadataTxId}`;
                const metadataResponse = await fetch(metadataUrl, {
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!metadataResponse.ok) {
                    throw new Error(`Metadata fetch failed: ${metadataResponse.status}`);
                }
                
                const metadata = await metadataResponse.json();
                
                // Get first media item if available
                if (metadata.archive && metadata.archive.media && metadata.archive.media.length > 0) {
                    return metadata.archive.media[0].txId;
                }
                
                return null;
            } catch (error) {
                console.error(`Error fetching metadata ${metadataTxId}:`, error);
                return null;
            }
        }
        
        // Render feed
        async function renderFeed() {
            if (!archiveIndex || !archiveIndex.mentions) return;
            
            const container = document.getElementById('feedContainer');
            
            if (archiveIndex.mentions.length === 0) {
                container.innerHTML = '<div class="loading">No archived content found.</div>';
                return;
            }
            
            // Get latest 10 (sorted by processedAt, newest first)
            const latest = [...archiveIndex.mentions]
                .sort((a, b) => new Date(b.processedAt) - new Date(a.processedAt))
                .slice(0, 10);
            
            const html = await Promise.all(latest.map(async (mention) => {
                // Use manifest TXID directly for faster loading (fallback to undername if missing)
                const manifestUrl = mention.manifestTxId 
                    ? `https://${BOT_CONFIG.gatewayHost}/${mention.manifestTxId}`
                    : `https://${mention.undername}_${BOT_CONFIG.arnsName}.${BOT_CONFIG.gatewayHost}`;
                const hasMedia = mention.mediaCount > 0;
                
                // Load manifest and metadata to get preview image
                let previewMediaTxId = null;
                if (hasMedia && mention.manifestTxId) {
                    const metadataTxId = await fetchManifestMetadata(mention.manifestTxId);
                    if (metadataTxId) {
                        previewMediaTxId = await getPreviewMediaTxId(metadataTxId);
                    }
                }
                
                // Construct preview URL from media TXID if available, otherwise use manifest URL
                const previewUrl = previewMediaTxId 
                    ? `https://${BOT_CONFIG.gatewayHost}/${previewMediaTxId}`
                    : (hasMedia ? manifestUrl : null);
                
                return `
                    <div class="feed-item" onclick="window.open('${manifestUrl}', '_blank')">
                        <div class="feed-header-info">
                            <div class="feed-user-info">
                                <span class="feed-username">@${mention.parentUsername}</span>
                            </div>
                            <span class="feed-date">${formatDate(mention.processedAt)}</span>
                        </div>
                        
                        <div class="feed-title">${mention.undername}</div>
                        
                        ${hasMedia && previewUrl ? `
                        <div class="feed-media-container">
                            <div class="feed-preview">
                                <img 
                                    src="${previewUrl}" 
                                    alt="${mention.undername}"
                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                                    onload="this.nextElementSibling.style.display='none';">
                                <div class="feed-preview-placeholder" style="display:none;">
                                    📱
                                </div>
                            </div>
                        </div>
                        ` : ''}
                        
                        <div class="feed-footer">
                            <div class="feed-meta">
                                <div class="feed-meta-item">
                                    ${hasMedia ? `<span class="media-badge media">${mention.mediaCount} Media</span>` : '<span class="media-badge">Link</span>'}
                                </div>
                                <div class="feed-meta-item">
                                    Archived by @${mention.mentionUsername}
                                </div>
                            </div>
                            <div class="feed-actions">
                                <a href="${manifestUrl}" target="_blank" class="feed-link" onclick="event.stopPropagation()">
                                    View →
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }));
            
            container.innerHTML = html.join('');
        }
        
        // Format date nicely
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) {
                return 'Today';
            } else if (diffDays === 1) {
                return 'Yesterday';
            } else if (diffDays < 7) {
                return `${diffDays} days ago`;
            } else {
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            }
        }
        
        // Load on page load
        loadArchiveIndex();
    </script>
</body>
</html>
