<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeedsArNS Archive - Permanent Twitter Archives on Arweave</title>
    <meta name="description" content="Permanently archived tweets on Arweave via ArNS. Browse the complete archive of archived Twitter content.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NeedsArNS Archive - Permanent Twitter Archives on Arweave">
    <meta property="og:description" content="Permanently archived tweets on Arweave via ArNS. Browse the complete archive of archived Twitter content.">
    <meta property="og:site_name" content="NeedsArNS Archive">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@NeedsArNS">
    <meta name="twitter:title" content="NeedsArNS Archive - Permanent Twitter Archives on Arweave">
    <meta name="twitter:description" content="Permanently archived tweets on Arweave via ArNS. Browse the complete archive of archived Twitter content.">
    
    <!-- Additional SEO -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="NeedsArNS">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #000000;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 16px;
            align-items: start;
        }
        
        .footer-container {
            grid-column: 1 / -1;
        }
        
        .main-content {
            min-width: 0;
        }
        
        .sidebar {
            position: sticky;
            top: 20px;
        }
        
        .header {
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }
        
        .sidebar-card {
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .sidebar-card h3 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #71767a;
            margin-bottom: 1.5rem;
        }
        
        .twitter-link {
            color: #1da1f2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        
        .twitter-link:hover {
            color: #1a91da;
            text-decoration: underline;
        }
        
        /* Stats Section */
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .stat-item {
            padding: 16px;
            border-bottom: 1px solid #2f3336;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-size: 13px;
            color: #71767a;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
        }
        
        .stat-detail {
            font-size: 13px;
            color: #71767a;
            margin-top: 4px;
        }
        
        /* Feed Section */
        .feed-container {
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 16px;
        }
        
        .feed-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2f3336;
        }
        
        .feed-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .feed-header p {
            color: #71767a;
            font-size: 15px;
        }
        
        .feed-item {
            padding: 16px;
            border-bottom: 1px solid #2f3336;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        
        .feed-item:hover {
            background-color: #16181c;
        }
        
        .feed-item:last-child {
            border-bottom: none;
        }
        
        .feed-header-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }
        
        .feed-user-info {
            display: flex;
            flex-direction: column;
        }
        
        .feed-username {
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
        }
        
        .feed-handle {
            font-size: 15px;
            color: #71767a;
        }
        
        .feed-date {
            font-size: 15px;
            color: #71767a;
            margin-left: auto;
        }
        
        .feed-title {
            font-size: 16px;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 12px;
            word-break: break-word;
        }
        
        .feed-media-container {
            margin-bottom: 12px;
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }
        
        .feed-preview {
            width: 100%;
            max-height: 400px;
            border-radius: 0;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        
        .feed-preview img,
        .feed-preview video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        
        .feed-preview-placeholder {
            width: 100%;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #16181c;
            color: #71767a;
            font-size: 3rem;
        }
        
        .feed-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2f3336;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .feed-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: #71767a;
        }
        
        .feed-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .feed-meta-item strong {
            color: #ffffff;
            font-weight: 600;
        }
        
        .feed-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        
        .feed-link {
            font-size: 13px;
            color: #1da1f2;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #2f3336;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-weight: 600;
            background-color: #000000;
        }
        
        .feed-link:hover {
            background-color: #16181c;
            border-color: #1da1f2;
            color: #1da1f2;
        }
        
        .media-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: #16181c;
            color: #71767a;
            border: 1px solid #2f3336;
        }
        
        .media-badge.media {
            background-color: #16181c;
            color: #1da1f2;
            border-color: #1da1f2;
        }
        
        .loading, .error {
            text-align: center;
            padding: 40px;
            color: #71767a;
            font-size: 15px;
        }
        
        .error {
            color: #f4212e;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            padding: 24px;
            color: #71767a;
            font-size: 14px;
        }
        
        .footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
        
        .footer a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }
        
        .load-more-container {
            text-align: center;
            padding: 24px 16px;
            border-top: 1px solid #2f3336;
        }
        
        .load-more-btn {
            background-color: #1da1f2;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }
        
        .load-more-btn:hover {
            background-color: #1a91da;
            transform: translateY(-1px);
        }
        
        .load-more-btn:disabled {
            background-color: #2f3336;
            color: #71767a;
            cursor: not-allowed;
            transform: none;
        }
        
        .load-more-btn:disabled:hover {
            background-color: #2f3336;
            transform: none;
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
            }
            
            .sidebar-card {
                margin-top: 16px;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            
            .header, .feed-container {
                padding: 16px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .feed-item {
                flex-direction: column;
            }
            
            .feed-preview {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="header">
                <h1>🏛️ NeedsArNS Archive</h1>
                <p class="subtitle">
                    Permanently archived on Arweave • 
                    <a href="https://twitter.com/NeedsArNS" target="_blank" class="twitter-link">@NeedsArNS</a>
                </p>
            </div>
            
            <div class="feed-container">
                <div class="feed-header">
                    <h2>Latest Archives</h2>
                </div>
                
                <div id="feedContainer">
                    <div class="loading">Loading archive...</div>
                </div>
                
                <div class="load-more-container" id="loadMoreContainer" style="display: none;">
                    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreArchives()">
                        Load More
                    </button>
                </div>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="sidebar-card">
                <h3>Archive Stats</h3>
                <div class="stats-list" id="statsContainer">
                    <div class="stat-item">
                        <div class="stat-label">Total Archives</div>
                        <div class="stat-value" id="statTotal">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Top Archiver</div>
                        <div class="stat-value" id="statTopArchiver">-</div>
                        <div class="stat-detail" id="statTopCount"></div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">With Media</div>
                        <div class="stat-value" id="statMedia">-</div>
                        <div class="stat-detail" id="statMediaPercent"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer-container">
            <div class="footer">
                <p>
                    <a href="https://twitter.com/arnsdomains" target="_blank">Powered by @ArNSdomains</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const fullHostname = window.location.hostname;
        const arnsName = 'needsarns';
        
        // Extract the gateway domain
        let gatewayHost = fullHostname;
        if (fullHostname.startsWith(`${arnsName}.`)) {
            gatewayHost = fullHostname.substring(arnsName.length + 1);
        }
        
        const BOT_CONFIG = {
            arnsName: arnsName,
            gatewayHost: gatewayHost,
            archiveIndexUrl: `https://archive_${arnsName}.${gatewayHost}`
        };
        
        let archiveIndex = null;
        let currentPage = 0;
        const ITEMS_PER_PAGE = 10;
        
        // Load more archives
        async function loadMoreArchives() {
            if (!archiveIndex || !archiveIndex.mentions) return;
            
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const originalText = loadMoreBtn.textContent;
            
            // Show loading state
            loadMoreBtn.disabled = true;
            loadMoreBtn.textContent = 'Loading...';
            
            try {
                // Increment page and re-render
                currentPage++;
                await renderFeed(false);
            } catch (error) {
                console.error('Error loading more archives:', error);
                // Reset button state on error
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = originalText;
            }
        }
        
        // Load archive index
        async function loadArchiveIndex() {
            let archiveData = null;
            const gatewayBase = `https://${BOT_CONFIG.gatewayHost}`;
            
            // Helper function to try fetching archive index
            // Since archive points directly to JSON (not a manifest), we need to get the raw transaction
            // We can't use /raw/ without knowing the TXID, so we'll try to parse the response
            async function tryFetchArchive(baseUrl) {
                try {
                    // Extract the transaction ID from the URL by checking if we can determine it
                    // First try: Extract TXID from undername by resolving it or try /raw/ pattern
                    // Since archive points to JSON directly, try /raw appended first
                    try {
                        // Try pattern: undername_url/raw (some gateways might support this)
                        const rawUrl = `${baseUrl}/raw`;
                        const rawResponse = await fetch(rawUrl, {
                            headers: { 'Accept': 'application/json' }
                        });
                        if (rawResponse.ok) {
                            const contentType = rawResponse.headers.get('content-type') || '';
                            const text = await rawResponse.text();
                            if (contentType.includes('json') || text.trim().startsWith('{') || text.trim().startsWith('[')) {
                                if (!text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
                                    return JSON.parse(text);
                                }
                            }
                        }
                    } catch (e) {
                        // Continue to direct fetch
                    }
                    
                    // Method 2: Try direct fetch
                    const directResponse = await fetch(baseUrl, {
                        headers: { 'Accept': 'application/json' }
                    });
                    if (directResponse.ok) {
                        const contentType = directResponse.headers.get('content-type') || '';
                        const text = await directResponse.text();
                        
                        // Check if we got HTML instead of JSON
                        if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html') || text.trim().startsWith('<!doctype')) {
                            return null; // Got HTML, can't parse
                        } else if (contentType.includes('json') || text.trim().startsWith('{') || text.trim().startsWith('[')) {
                            return JSON.parse(text);
                        }
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            }
            
            // Try primary URL
            console.log('Fetching archive index from:', BOT_CONFIG.archiveIndexUrl);
            archiveData = await tryFetchArchive(BOT_CONFIG.archiveIndexUrl);
            
            // Try fallback to ar.io if failed and not already using ar.io
            if (!archiveData && gatewayHost !== 'ar.io') {
                console.log('Trying fallback to ar.io...');
                archiveData = await tryFetchArchive(`https://archive_${arnsName}.ar.io`);
            }
            
            if (archiveData) {
                archiveIndex = archiveData;
                console.log('Archive index loaded:', archiveIndex);
                renderStats();
                renderFeed(true); // Reset pagination on initial load
            } else {
                console.error('Failed to fetch archive index from all sources');
                document.getElementById('feedContainer').innerHTML = 
                    '<div class="error">Failed to load archive. Please try again later.</div>';
            }
        }
        
        // Calculate and render stats
        function renderStats() {
            if (!archiveIndex || !archiveIndex.mentions || archiveIndex.mentions.length === 0) {
                // Show zeros if no data
                document.getElementById('statTotal').textContent = '0';
                document.getElementById('statTopArchiver').textContent = '-';
                document.getElementById('statTopCount').textContent = '';
                document.getElementById('statMedia').textContent = '0';
                document.getElementById('statMediaPercent').textContent = '0% of total';
                return;
            }
            
            const mentions = archiveIndex.mentions;
            const total = archiveIndex.metadata?.totalMentions || mentions.length;
            
            // Calculate top archiver
            const archiverCounts = {};
            mentions.forEach(m => {
                const username = m.mentionUsername || 'unknown';
                archiverCounts[username] = (archiverCounts[username] || 0) + 1;
            });
            
            const topArchiver = Object.entries(archiverCounts)
                .sort((a, b) => b[1] - a[1])[0];
            
            // Calculate media stats
            const withMedia = mentions.filter(m => (m.mediaCount || 0) > 0).length;
            const mediaPercent = total > 0 ? Math.round((withMedia / total) * 100) : 0;
            
            // Update DOM
            document.getElementById('statTotal').textContent = total;
            
            if (topArchiver && topArchiver[0] !== 'unknown') {
                document.getElementById('statTopArchiver').textContent = `@${topArchiver[0]}`;
                document.getElementById('statTopCount').textContent = `${topArchiver[1]} archive${topArchiver[1] !== 1 ? 's' : ''}`;
            } else {
                document.getElementById('statTopArchiver').textContent = '-';
                document.getElementById('statTopCount').textContent = '';
            }
            
            document.getElementById('statMedia').textContent = withMedia;
            document.getElementById('statMediaPercent').textContent = `${mediaPercent}% of total`;
        }
        
        // Helper: Fetch manifest and extract metadata TXID
        async function fetchManifestMetadata(manifestTxId) {
            try {
                // For ar.io gateway, always use arweave.net for TXID fetching
                const gatewayBase = BOT_CONFIG.gatewayHost === 'ar.io' ? 'https://arweave.net' : `https://${BOT_CONFIG.gatewayHost}`;
                let manifestData = null;
                
                // Method 1: Try /raw/ path to get raw transaction data
                try {
                    const rawResponse = await fetch(`${gatewayBase}/raw/${manifestTxId}`, {
                        headers: { 'Accept': 'application/json' }
                    });
                    if (rawResponse.ok) {
                        const contentType = rawResponse.headers.get('content-type') || '';
                        const text = await rawResponse.text();
                        if (contentType.includes('json') || text.trim().startsWith('{') || text.trim().startsWith('[')) {
                            manifestData = JSON.parse(text);
                        }
                    }
                } catch (e) {
                    // Continue to next method
                }
                
                // Method 2: Try /tx/{id}/data endpoint as fallback
                if (!manifestData) {
                    try {
                        const txResponse = await fetch(`${gatewayBase}/tx/${manifestTxId}/data`, {
                            headers: { 'Accept': 'application/json' }
                        });
                        if (txResponse.ok) {
                            manifestData = await txResponse.json();
                        }
                    } catch (e) {
                        // Try arweave.net as fallback if using different gateway
                        if (BOT_CONFIG.gatewayHost !== 'arweave.net') {
                            try {
                                const arweaveNetResponse = await fetch(`https://arweave.net/tx/${manifestTxId}/data`, {
                                    headers: { 'Accept': 'application/json' }
                                });
                                if (arweaveNetResponse.ok) {
                                    manifestData = await arweaveNetResponse.json();
                                }
                            } catch (e2) {
                                // Continue
                            }
                        }
                    }
                }
                
                if (!manifestData) {
                    throw new Error('Unable to fetch manifest');
                }
                
                // Check if it's a manifest (has manifest and paths)
                if (manifestData.manifest === 'arweave/paths' && manifestData.paths && manifestData.paths['metadata.json']) {
                    return manifestData.paths['metadata.json'].id;
                }
                
                throw new Error('Invalid manifest format');
            } catch (error) {
                console.error(`Error fetching manifest ${manifestTxId}:`, error);
                return null;
            }
        }
        
        // Helper: Fetch metadata and extract tweet text and media
        async function fetchMetadataContent(metadataTxId) {
            try {
                // For ar.io gateway, always use arweave.net for TXID fetching
                const gatewayBase = BOT_CONFIG.gatewayHost === 'ar.io' ? 'https://arweave.net' : `https://${BOT_CONFIG.gatewayHost}`;
                let metadata = null;
                
                // Method 1: Try /raw/ path to get raw transaction data
                try {
                    const rawResponse = await fetch(`${gatewayBase}/raw/${metadataTxId}`, {
                        headers: { 'Accept': 'application/json' }
                    });
                    if (rawResponse.ok) {
                        const contentType = rawResponse.headers.get('content-type') || '';
                        const text = await rawResponse.text();
                        if (contentType.includes('json') || text.trim().startsWith('{') || text.trim().startsWith('[')) {
                            metadata = JSON.parse(text);
                        }
                    }
                } catch (e) {
                    // Continue to next method
                }
                
                // Method 2: Try /tx/{id}/data endpoint as fallback
                if (!metadata) {
                    try {
                        const txResponse = await fetch(`${gatewayBase}/tx/${metadataTxId}/data`, {
                            headers: { 'Accept': 'application/json' }
                        });
                        if (txResponse.ok) {
                            metadata = await txResponse.json();
                        }
                    } catch (e) {
                        // Try arweave.net as fallback if using different gateway
                        if (BOT_CONFIG.gatewayHost !== 'arweave.net') {
                            try {
                                const arweaveNetResponse = await fetch(`https://arweave.net/tx/${metadataTxId}/data`, {
                                    headers: { 'Accept': 'application/json' }
                                });
                                if (arweaveNetResponse.ok) {
                                    metadata = await arweaveNetResponse.json();
                                }
                            } catch (e2) {
                                // Continue
                            }
                        }
                    }
                }
                
                if (!metadata) {
                    throw new Error('Unable to fetch metadata');
                }
                
                // Extract tweet text and media from metadata
                const parentTweet = metadata.rawApiResponse?.parentTweet;
                const tweetText = parentTweet?.text || 'Tweet content unavailable';
                
                // Get first media item if available
                let previewMediaTxId = null;
                let previewMediaType = null;
                if (metadata.archive && metadata.archive.media && metadata.archive.media.length > 0) {
                    previewMediaTxId = metadata.archive.media[0].txId;
                    previewMediaType = metadata.archive.media[0].type || null;
                }
                
                return {
                    tweetText,
                    previewMediaTxId,
                    previewMediaType
                };
            } catch (error) {
                console.error(`Error fetching metadata ${metadataTxId}:`, error);
                return {
                    tweetText: 'Tweet content unavailable',
                    previewMediaTxId: null,
                    previewMediaType: null
                };
            }
        }
        
        
        
        // Render feed
        async function renderFeed(reset = false) {
            if (!archiveIndex || !archiveIndex.mentions) return;
            
            const container = document.getElementById('feedContainer');
            const loadMoreContainer = document.getElementById('loadMoreContainer');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if (archiveIndex.mentions.length === 0) {
                container.innerHTML = '<div class="loading">No archived content found.</div>';
                loadMoreContainer.style.display = 'none';
                return;
            }
            
            // Reset pagination if this is a fresh load
            if (reset) {
                currentPage = 0;
            }
            
            // Get items for current page (sorted by processedAt, newest first)
            const sortedMentions = [...archiveIndex.mentions]
                .sort((a, b) => new Date(b.processedAt) - new Date(a.processedAt));
            
            const startIndex = currentPage * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const currentPageItems = sortedMentions.slice(0, endIndex);
            
            // Check if there are more items to load
            const hasMore = endIndex < sortedMentions.length;
            
            // Show/hide load more button
            if (hasMore) {
                loadMoreContainer.style.display = 'block';
                loadMoreBtn.disabled = false;
                const remaining = sortedMentions.length - endIndex;
                loadMoreBtn.textContent = `Load More (${remaining} remaining)`;
            } else {
                loadMoreContainer.style.display = 'none';
            }
            
            const html = await Promise.all(currentPageItems.map(async (mention) => {
                // Always use ArNS undername URL for the view link
                const manifestUrl = `https://${mention.undername}_${BOT_CONFIG.arnsName}.${BOT_CONFIG.gatewayHost}`;
                const hasMedia = mention.mediaCount > 0;
                
                // Fetch manifest metadata to get tweet text and media
                let tweetText = 'Tweet content unavailable';
                let previewMediaTxId = null;
                let previewMediaType = null;
                
                if (mention.manifestTxId) {
                    const metadataTxId = await fetchManifestMetadata(mention.manifestTxId);
                    if (metadataTxId) {
                        const metadataContent = await fetchMetadataContent(metadataTxId);
                        tweetText = metadataContent.tweetText;
                        previewMediaTxId = metadataContent.previewMediaTxId;
                        previewMediaType = metadataContent.previewMediaType;
                    }
                }
                
                // Construct preview URL from media TXID if available
                // For ar.io gateway, use arweave.net for media previews
                const mediaGateway = BOT_CONFIG.gatewayHost === 'ar.io' ? 'arweave.net' : BOT_CONFIG.gatewayHost;
                const previewUrl = previewMediaTxId 
                    ? `https://${mediaGateway}/${previewMediaTxId}`
                    : null;
                
                return `
                    <div class="feed-item" onclick="window.open('${manifestUrl}', '_blank')">
                        <div class="feed-header-info">
                            <div class="feed-user-info">
                                <span class="feed-username">@${mention.parentUsername}</span>
                            </div>
                            <span class="feed-date">${formatDate(mention.processedAt)}</span>
                        </div>
                        
                        <div class="feed-title">${tweetText}</div>
                        
                        ${hasMedia && previewUrl ? `
                        <div class="feed-media-container">
                            <div class="feed-preview">
                                ${previewMediaType === 'video' ? `
                                <video 
                                    src="${previewUrl}" 
                                    controls
                                    preload="metadata"
                                    style="width: 100%; height: auto; max-height: 400px; object-fit: cover;"
                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                                    onloadeddata="this.nextElementSibling.style.display='none';">
                                </video>
                                <div class="feed-preview-placeholder" style="display:none;">📹</div>
                                ` : `
                                <img 
                                    src="${previewUrl}"
                                    alt=""
                                    style="width: 100%; height: auto; max-height: 400px; object-fit: cover;"
                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                                    onload="this.nextElementSibling.style.display='none';"
                                />
                                <div class="feed-preview-placeholder" style="display:none;">🖼️</div>
                                `}
                            </div>
                        </div>
                        ` : ''}
                        
                        <div class="feed-footer">
                            <div class="feed-meta">
                                <div class="feed-meta-item">
                                    ${hasMedia ? `<span class="media-badge media">${mention.mediaCount} Media</span>` : '<span class="media-badge">Link</span>'}
                                </div>
                                <div class="feed-meta-item">
                                    Archived by @${mention.mentionUsername}
                                </div>
                            </div>
                            <div class="feed-actions">
                                <a href="${manifestUrl}" target="_blank" class="feed-link" onclick="event.stopPropagation()">
                                    View →
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }));
            
            container.innerHTML = html.join('');
        }
        
        // Format date nicely
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) {
                return 'Today';
            } else if (diffDays === 1) {
                return 'Yesterday';
            } else if (diffDays < 7) {
                return `${diffDays} days ago`;
            } else {
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            }
        }
        
        // Load on page load
        loadArchiveIndex();
    </script>
</body>
</html>
