<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweet Archive</title>
  <meta name="description" content="Tweet Archive">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #15202b;
      color: #ffffff;
      padding: 20px;
      line-height: 1.5;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #192734;
      border: 1px solid #38444d;
      border-radius: 16px;
      padding: 16px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #8b98a5;
    }
    
    .error {
      text-align: center;
      padding: 40px;
      color: #f4212e;
    }
    
    .tweet-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    
    .user-info {
      display: flex;
      flex-direction: column;
    }
    
    .username {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }
    
    .handle {
      font-size: 15px;
      color: #8b98a5;
    }
    
    .date {
      font-size: 15px;
      color: #8b98a5;
      margin-left: auto;
    }
    
    .tweet-text {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .media-grid {
      margin-bottom: 12px;
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      gap: 2px;
      background-color: #000;
    }
    
    .media-grid.single {
      grid-template-columns: 1fr;
    }
    
    .media-grid.double {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .media-grid.triple {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .media-grid.quad {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .media-item {
      position: relative;
      width: 100%;
      background-color: #000;
    }
    
    .media-item.span-full {
      grid-column: 1 / -1;
    }
    
    .media-item img,
    .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .video-error-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .archive-footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #38444d;
      font-size: 14px;
      color: #8b98a5;
      text-align: center;
    }
    
    .archive-footer a {
      color: #1d9bf0;
      text-decoration: none;
    }
    
    .archive-footer a:hover {
      text-decoration: underline;
    }
    
    .request-info {
      margin-top: 12px;
      padding: 12px;
      background-color: #1c2938;
      border-radius: 8px;
      font-size: 13px;
      color: #8b98a5;
    }
    
    .request-info strong {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading" id="loading">
      Loading archive...
    </div>
    
    <div class="error" id="error" style="display: none;">
      Failed to load archive data
    </div>
    
    <div id="tweet-content" style="display: none;">
      <!-- Will be populated by JavaScript -->
    </div>
  </div>

  <script>
    const arweaveGateway = 'https://arweave.net';
    
    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
    
    // Format date and time
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('en-US', { 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    
    // Generate media grid HTML
    function generateMediaGrid(mediaArray) {
      if (!mediaArray || mediaArray.length === 0) {
        return '';
      }

      const count = mediaArray.length;
      let gridClass = 'single';
      
      if (count === 2) gridClass = 'double';
      else if (count === 3) gridClass = 'triple';
      else if (count >= 4) gridClass = 'quad';

      let mediaItems = '';
      
      mediaArray.slice(0, 4).forEach((media, index) => {
        const spanFull = (count === 3 && index === 0) ? ' span-full' : '';
        
        if (media.type === 'photo') {
          mediaItems += `
          <div class="media-item${spanFull}">
            <img src="${arweaveGateway}/${media.txId}" alt="${escapeHtml(media.alt_text || 'Image')}">
          </div>`;
        } else if (media.type === 'link') {
          // Smart preview for link type content
          mediaItems += `
          <div class="media-item${spanFull}">
            <div style="position: relative; width: 100%; height: 300px; background: #1c2938; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
              <img src="${arweaveGateway}/${media.txId}" 
                   style="max-width: 100%; max-height: 100%; object-fit: contain;"
                   alt="${escapeHtml(media.alt_text || 'Content preview')}"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <div style="display: none; flex-direction: column; align-items: center; gap: 12px;">
                <div style="font-size: 48px;">📄</div>
                <p style="color: #8b98a5;">Content Preview</p>
                <a href="${arweaveGateway}/${media.txId}" target="_blank" 
                   style="color: #1d9bf0; text-decoration: none; padding: 8px 16px; border: 1px solid #1d9bf0; border-radius: 4px;">
                  View Full Content
                </a>
              </div>
            </div>
          </div>`;
        } else if (media.type === 'video' || media.type === 'animated_gif') {
          const videoAttrs = media.type === 'animated_gif' ? 'autoplay loop muted' : 'controls';
          mediaItems += `
          <div class="media-item${spanFull}">
            <video ${videoAttrs} 
                   preload="metadata"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                   onloadeddata="this.nextElementSibling.style.display='none';"
                   style="width: 100%; height: 100%; object-fit: cover; display: block;">
              <source src="${arweaveGateway}/${media.txId}" type="video/mp4">
              <source src="${arweaveGateway}/${media.txId}" type="video/webm">
              Your browser does not support the video tag.
            </video>
            <div class="video-error-fallback" style="display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #1c2938; border-radius: 8px;">
              <div style="font-size: 48px;">📹</div>
              <p style="color: #8b98a5;">Video unavailable</p>
              <a href="${arweaveGateway}/${media.txId}" target="_blank" 
                 style="color: #1d9bf0; text-decoration: none; padding: 8px 16px; border: 1px solid #1d9bf0; border-radius: 4px;">
                View Video
              </a>
            </div>
          </div>`;
        }
      });

      return `<div class="media-grid ${gridClass}">${mediaItems}</div>`;
    }
    
    // Filter out Twitter-generated media links (these are auto-added, not user-provided)
    function filterUserLinks(entities) {
      if (!entities?.urls) return { urls: [] };
      
      return {
        urls: entities.urls.filter(urlEntity => {
          const expandedUrl = urlEntity.expanded_url || '';
          // Skip Twitter auto-generated media links
          const isMediaLink = /\/status\/\d+\/(photo|video)\/\d+/i.test(expandedUrl) ||
                              /^https?:\/\/(pic\.)?x\.com\//i.test(expandedUrl);
          return !isMediaLink;
        })
      };
    }
    
    // Replace t.co links with expanded URLs (only user-provided links)
    // Remove Twitter media links entirely from the text
    function expandUrls(text, entities) {
      if (!entities?.urls || entities.urls.length === 0) {
        return text;
      }
      
      let expandedText = text;
      
      // Process all URL entities
      entities.urls.forEach(urlEntity => {
        const expandedUrl = urlEntity.expanded_url || '';
        const tcoUrl = urlEntity.url;
        
        // Check if this is a Twitter media link
        const isMediaLink = /\/status\/\d+\/(photo|video)\/\d+/i.test(expandedUrl) ||
                            /^https?:\/\/(pic\.)?x\.com\//i.test(expandedUrl);
        
        if (isMediaLink) {
          // Remove the t.co URL entirely (with surrounding spaces if present)
          expandedText = expandedText.replace(new RegExp(`\\s*${tcoUrl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*`, 'g'), ' ').trim();
        } else {
          // Expand user-provided links
          expandedText = expandedText.replace(tcoUrl, expandedUrl);
        }
      });
      
      // Clean up any extra whitespace
      expandedText = expandedText.replace(/\s+/g, ' ').trim();
      
      return expandedText;
    }
    
    // Render tweet from metadata
    function renderTweet(metadata) {
      const { rawApiResponse, archive } = metadata;
      const mentionTweet = rawApiResponse.mentionTweet;
      const parentTweet = rawApiResponse.parentTweet;
      const includes = rawApiResponse.includes || {};
      
      // Extract fields from raw API response
      const parentUsername = includes.users?.find(u => u.id === parentTweet.author_id)?.username || 'unknown';
      const mentionUsername = includes.users?.find(u => u.id === mentionTweet.author_id)?.username || 'unknown';
      const parentText = parentTweet.text || '';
      const parentCreatedAt = parentTweet.created_at || new Date().toISOString();
      const mentionCreatedAt = mentionTweet.created_at || new Date().toISOString();
      const parentEntities = parentTweet.entities || null;
      
      const tweetDate = formatDate(parentCreatedAt);
      const mediaHTML = generateMediaGrid(archive.media);
      const requestDate = new Date(mentionCreatedAt).toLocaleString('en-US');
      
      // Expand URLs in tweet text
      const expandedText = expandUrls(parentText, parentEntities);
      
      const html = `
        <div class="tweet-header">
          <div class="user-info">
            <span class="username">@${escapeHtml(parentUsername)}</span>
          </div>
          <span class="date">${tweetDate}</span>
        </div>
        
        <div class="tweet-text">${escapeHtml(expandedText)}</div>
        
        ${mediaHTML}
        
        <div class="archive-footer">
          <div>🏛️ Archived on Arweave via <a href="https://twitter.com/NeedsArNS" target="_blank">@NeedsArNS</a></div>
          <div class="request-info">
            <strong>Requested by:</strong> @${escapeHtml(mentionUsername)}<br>
            <strong>Archived:</strong> ${requestDate}
          </div>
        </div>
      `;
      
      document.getElementById('tweet-content').innerHTML = html;
      document.getElementById('tweet-content').style.display = 'block';
      
      // Update page title and meta description
      document.title = `Tweet Archive - @${parentUsername}`;
      document.querySelector('meta[name="description"]').setAttribute('content', escapeHtml(expandedText));
    }
    
    // Load and render metadata
    async function loadArchive() {
      try {
        const response = await fetch('./metadata.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const metadata = await response.json();
        renderTweet(metadata);
        
        // Hide loading
        document.getElementById('loading').style.display = 'none';
        
      } catch (error) {
        console.error('Failed to load archive:', error);
        
        // Show error
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }
    
    // Start loading when page loads
    document.addEventListener('DOMContentLoaded', loadArchive);
  </script>
</body>
</html>
