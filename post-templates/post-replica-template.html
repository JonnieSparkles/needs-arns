<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Archive</title>
  <meta name="description" content="Post Archive">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Post Archive" id="og-title">
  <meta property="og:description" content="Post Archive" id="og-description">
  <meta property="og:image" content="" id="og-image">
  <meta property="og:url" content="" id="og-url">
  <meta property="og:site_name" content="NeedsArNS Archive">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@NeedsArNS">
  <meta name="twitter:title" content="Post Archive" id="twitter-title">
  <meta name="twitter:description" content="Post Archive" id="twitter-description">
  <meta name="twitter:image" content="" id="twitter-image">
  
  <!-- Additional SEO -->
  <meta name="robots" content="index, follow">
  <meta name="author" content="NeedsArNS">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      padding: 20px;
      line-height: 1.5;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #000000;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 16px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #71767a;
    }
    
    .error {
      text-align: center;
      padding: 40px;
      color: #f4212e;
    }
    
    .manual-input {
      margin-top: 24px;
      padding: 24px;
      background-color: #16181c;
      border-radius: 8px;
      border: 1px solid #2f3336;
    }
    
    .manual-input h3 {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    
    .manual-input p {
      font-size: 14px;
      color: #71767a;
      margin-bottom: 16px;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
    
    .input-group label {
      display: block;
      font-size: 14px;
      color: #ffffff;
      margin-bottom: 6px;
      font-weight: 500;
    }
    
    .input-group input {
      width: 100%;
      padding: 10px 12px;
      background-color: #000000;
      border: 1px solid #2f3336;
      border-radius: 4px;
      color: #ffffff;
      font-size: 14px;
      font-family: 'Monaco', 'Menlo', 'SF Mono', monospace;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: #2f3336;
      background-color: #16181c;
    }
    
    .input-group input::placeholder {
      color: #71767a;
    }
    
    .load-button {
      width: 100%;
      padding: 12px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    .load-button:hover {
      opacity: 0.9;
    }
    
    .load-button:active {
      opacity: 0.8;
    }
    
    .load-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .tweet-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    
    .user-info {
      display: flex;
      flex-direction: column;
    }
    
    .username {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }
    
    .handle {
      font-size: 15px;
      color: #71767a;
    }
    
    .date {
      font-size: 15px;
      color: #71767a;
      margin-left: auto;
    }
    
    .tweet-text {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .media-grid {
      margin-bottom: 12px;
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      gap: 2px;
      background-color: #000;
    }
    
    .media-grid.single {
      grid-template-columns: 1fr;
    }
    
    .media-grid.double {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .media-grid.triple {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .media-grid.quad {
      grid-template-columns: repeat(2, 1fr);
    }
    
    .media-item {
      position: relative;
      width: 100%;
      background-color: #000;
    }
    
    .media-item.span-full {
      grid-column: 1 / -1;
    }
    
    .media-item img,
    .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .video-error-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .archive-footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #2f3336;
      font-size: 14px;
      color: #71767a;
      text-align: center;
    }
    
    .archive-footer a {
      color: #ffffff;
      text-decoration: none;
    }
    
    .archive-footer a:hover {
      text-decoration: underline;
      opacity: 0.8;
    }
    
    .request-info {
      margin-top: 12px;
      padding: 12px;
      background-color: #16181c;
      border-radius: 8px;
      font-size: 13px;
      color: #71767a;
    }
    
    .request-info strong {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading" id="loading">
      Loading archive...
    </div>
    
    <div class="error" id="error" style="display: none;">
      <div>Failed to load archive data</div>
      <div class="manual-input">
        <h3>Manual Load</h3>
        <p>Enter either a manifest TXID or metadata.json TXID to load the archive:</p>
        <div class="input-group">
          <label for="manifest-txid">Manifest TXID (or metadata.json TXID):</label>
          <input type="text" id="manifest-txid" placeholder="e.g. ABC123..." maxlength="43" pattern="[A-Za-z0-9_-]{43}">
        </div>
        <button class="load-button" id="load-button" onclick="loadFromTxId()">Load Archive</button>
      </div>
    </div>
    
    <div id="tweet-content" style="display: none;">
      <!-- Will be populated by JavaScript -->
    </div>
  </div>

  <script>
    // Detect current gateway from hostname (same logic as homepage)
    function detectGateway() {
      const hostname = window.location.hostname;
      
      // If we're on arweave.net, use that
      if (hostname.includes('arweave.net')) {
        return 'https://arweave.net';
      }
      
      // Extract gateway from ArNS hostname (e.g., needsarns.vilenarios.com -> vilenarios.com)
      // Or if already a gateway domain, use it
      if (hostname.includes('.')) {
        const parts = hostname.split('.');
        // Check if it looks like an ArNS subdomain (e.g., needsarns.domain.com)
        if (parts.length >= 3) {
          // Remove first part (ArNS name) to get gateway
          const gatewayHost = parts.slice(1).join('.');
          return `${window.location.protocol}//${gatewayHost}`;
        } else {
          // Already a gateway domain (e.g., ar.io, arweave.live)
          return `${window.location.protocol}//${hostname}`;
        }
      }
      
      // Fallback to arweave.net
      return 'https://arweave.net';
    }
    
    const arweaveGateway = detectGateway();
    
    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
    
    // Format date and time
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('en-US', { 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    
    // Generate media grid HTML
    function generateMediaGrid(mediaArray) {
      if (!mediaArray || mediaArray.length === 0) {
        return '';
      }

      const count = mediaArray.length;
      let gridClass = 'single';
      
      if (count === 2) gridClass = 'double';
      else if (count === 3) gridClass = 'triple';
      else if (count >= 4) gridClass = 'quad';

      let mediaItems = '';
      
      mediaArray.slice(0, 4).forEach((media, index) => {
        const spanFull = (count === 3 && index === 0) ? ' span-full' : '';
        
        if (media.type === 'photo') {
          mediaItems += `
          <div class="media-item${spanFull}">
            <img src="${arweaveGateway}/${media.txId}" alt="${escapeHtml(media.alt_text || 'Image')}">
          </div>`;
        } else if (media.type === 'link') {
          // Smart preview for link type content
          mediaItems += `
          <div class="media-item${spanFull}">
            <div style="position: relative; width: 100%; height: 300px; background: #16181c; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
              <img src="${arweaveGateway}/${media.txId}" 
                   style="max-width: 100%; max-height: 100%; object-fit: contain;"
                   alt="${escapeHtml(media.alt_text || 'Content preview')}"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <div style="display: none; flex-direction: column; align-items: center; gap: 12px;">
                <div style="font-size: 48px;">📄</div>
                <p style="color: #71767a;">Content Preview</p>
                <a href="${arweaveGateway}/${media.txId}" target="_blank" 
                   style="color: #ffffff; text-decoration: none; padding: 8px 16px; border: 1px solid #2f3336; border-radius: 4px; transition: opacity 0.2s;">
                  View Full Content
                </a>
              </div>
            </div>
          </div>`;
        } else if (media.type === 'video' || media.type === 'animated_gif') {
          const videoAttrs = media.type === 'animated_gif' ? 'autoplay loop muted' : 'controls';
          mediaItems += `
          <div class="media-item${spanFull}">
            <video ${videoAttrs} 
                   preload="metadata"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                   onloadeddata="this.nextElementSibling.style.display='none';"
                   style="width: 100%; height: 100%; object-fit: cover; display: block;">
              <source src="${arweaveGateway}/${media.txId}" type="video/mp4">
              <source src="${arweaveGateway}/${media.txId}" type="video/webm">
              Your browser does not support the video tag.
            </video>
            <div class="video-error-fallback" style="display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #16181c; border-radius: 8px;">
              <div style="font-size: 48px;">📹</div>
              <p style="color: #71767a;">Video unavailable</p>
              <a href="${arweaveGateway}/${media.txId}" target="_blank" 
                 style="color: #ffffff; text-decoration: none; padding: 8px 16px; border: 1px solid #2f3336; border-radius: 4px; transition: opacity 0.2s;">
                View Video
              </a>
            </div>
          </div>`;
        }
      });

      return `<div class="media-grid ${gridClass}">${mediaItems}</div>`;
    }
    
    // Filter out Twitter-generated media links (these are auto-added, not user-provided)
    function filterUserLinks(entities) {
      if (!entities?.urls) return { urls: [] };
      
      return {
        urls: entities.urls.filter(urlEntity => {
          const expandedUrl = urlEntity.expanded_url || '';
          // Skip Twitter auto-generated media links
          const isMediaLink = /\/status\/\d+\/(photo|video)\/\d+/i.test(expandedUrl) ||
                              /^https?:\/\/(pic\.)?x\.com\//i.test(expandedUrl);
          return !isMediaLink;
        })
      };
    }
    
    // Replace t.co links with expanded URLs (only user-provided links)
    // Remove Twitter media links entirely from the text
    function expandUrls(text, entities) {
      if (!entities?.urls || entities.urls.length === 0) {
        return text;
      }
      
      let expandedText = text;
      
      // Process all URL entities
      entities.urls.forEach(urlEntity => {
        const expandedUrl = urlEntity.expanded_url || '';
        const tcoUrl = urlEntity.url;
        
        // Check if this is a Twitter media link
        const isMediaLink = /\/status\/\d+\/(photo|video)\/\d+/i.test(expandedUrl) ||
                            /^https?:\/\/(pic\.)?x\.com\//i.test(expandedUrl);
        
        if (isMediaLink) {
          // Remove the t.co URL entirely (with surrounding spaces if present)
          expandedText = expandedText.replace(new RegExp(`\\s*${tcoUrl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*`, 'g'), ' ').trim();
        } else {
          // Expand user-provided links
          expandedText = expandedText.replace(tcoUrl, expandedUrl);
        }
      });
      
      // Clean up any extra whitespace
      expandedText = expandedText.replace(/\s+/g, ' ').trim();
      
      return expandedText;
    }
    
    // Render tweet from metadata
    function renderTweet(metadata) {
      const { rawApiResponse, archive } = metadata;
      const mentionTweet = rawApiResponse.mentionTweet;
      const parentTweet = rawApiResponse.parentTweet;
      const includes = rawApiResponse.includes || {};
      
      // Extract fields from raw API response
      const parentUsername = includes.users?.find(u => u.id === parentTweet.author_id)?.username || 'unknown';
      const mentionUsername = includes.users?.find(u => u.id === mentionTweet.author_id)?.username || 'unknown';
      const parentText = parentTweet.text || '';
      const parentCreatedAt = parentTweet.created_at || new Date().toISOString();
      const mentionCreatedAt = mentionTweet.created_at || new Date().toISOString();
      const parentEntities = parentTweet.entities || null;
      
      const tweetDate = formatDate(parentCreatedAt);
      const mediaHTML = generateMediaGrid(archive.media);
      const requestDate = new Date(mentionCreatedAt).toLocaleString('en-US');
      
      // Expand URLs in tweet text
      const expandedText = expandUrls(parentText, parentEntities);
      
      const html = `
        <div class="tweet-header">
          <div class="user-info">
            <span class="username">@${escapeHtml(parentUsername)}</span>
          </div>
          <span class="date">${tweetDate}</span>
        </div>
        
        <div class="tweet-text">${escapeHtml(expandedText)}</div>
        
        ${mediaHTML}
        
        <div class="archive-footer">
          <div>🏛️ Archived on Arweave via <a href="https://x.com/NeedsArNS" target="_blank">@NeedsArNS</a></div>
          <div class="request-info">
            <strong>Requested by:</strong> @${escapeHtml(mentionUsername)}<br>
            <strong>Archived:</strong> ${requestDate}<br>
            <strong>Original post:</strong> <a href="https://x.com/${escapeHtml(parentUsername)}/status/${parentTweet.id}" target="_blank" style="color: #ffffff; text-decoration: none;">View on X/Twitter</a>
          </div>
        </div>
      `;
      
      document.getElementById('tweet-content').innerHTML = html;
      document.getElementById('tweet-content').style.display = 'block';
      
      // Update page title and meta description
      const pageTitle = `Post Archive - @${parentUsername}`;
      const pageDescription = expandedText.length > 200 ? expandedText.substring(0, 197) + '...' : expandedText;
      document.title = pageTitle;
      document.querySelector('meta[name="description"]').setAttribute('content', pageDescription);
      
      // Update Open Graph meta tags
      document.getElementById('og-title').setAttribute('content', pageTitle);
      document.getElementById('og-description').setAttribute('content', pageDescription);
      document.getElementById('og-url').setAttribute('content', window.location.href);
      
      // Update Twitter Card meta tags
      document.getElementById('twitter-title').setAttribute('content', pageTitle);
      document.getElementById('twitter-description').setAttribute('content', pageDescription);
      
      // Set Open Graph and Twitter image to first media item if available
      if (archive.media && archive.media.length > 0 && archive.media[0].type === 'photo') {
        const imageUrl = `${arweaveGateway}/${archive.media[0].txId}`;
        document.getElementById('og-image').setAttribute('content', imageUrl);
        document.getElementById('twitter-image').setAttribute('content', imageUrl);
      }
    }
    
    // Fetch metadata from a TXID (either manifest or direct metadata)
    async function fetchMetadataFromTxId(txId) {
      try {
        // First, try to fetch as manifest
        const manifestResponse = await fetch(`${arweaveGateway}/${txId}`);
        if (!manifestResponse.ok) {
          throw new Error(`Failed to fetch ${txId}`);
        }
        
        const manifestData = await manifestResponse.json();
        
        // Check if it's a manifest (has manifest and paths)
        if (manifestData.manifest === 'arweave/paths' && manifestData.paths && manifestData.paths['metadata.json']) {
          // It's a manifest, extract metadata TXID
          const metadataTxId = manifestData.paths['metadata.json'].id;
          console.log(`Found manifest, metadata TXID: ${metadataTxId}`);
          
          // Fetch metadata.json from manifest
          const metadataResponse = await fetch(`${arweaveGateway}/${metadataTxId}`);
          if (!metadataResponse.ok) {
            throw new Error(`Failed to fetch metadata: ${metadataTxId}`);
          }
          
          return await metadataResponse.json();
        } else {
          // Assume it's metadata.json directly
          console.log(`Treating as direct metadata.json`);
          return manifestData;
        }
      } catch (error) {
        console.error('Error fetching from TXID:', error);
        throw error;
      }
    }
    
    // Load and render metadata
    async function loadArchive() {
      try {
        const response = await fetch('./metadata.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const metadata = await response.json();
        renderTweet(metadata);
        
        // Hide loading
        document.getElementById('loading').style.display = 'none';
        
      } catch (error) {
        console.error('Failed to load archive:', error);
        
        // Show error with manual input option
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }
    
    // Load archive from manual TXID input
    async function loadFromTxId() {
      const txIdInput = document.getElementById('manifest-txid');
      const loadButton = document.getElementById('load-button');
      const txId = txIdInput.value.trim();
      
      // Basic validation
      if (!txId || txId.length < 10) {
        alert('Please enter a valid Arweave TXID (at least 10 characters)');
        return;
      }
      
      // Disable button and show loading
      loadButton.disabled = true;
      loadButton.textContent = 'Loading...';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';
      
      try {
        const metadata = await fetchMetadataFromTxId(txId);
        renderTweet(metadata);
        
        // Hide loading and error
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'none';
        
      } catch (error) {
        console.error('Failed to load from TXID:', error);
        
        // Show error again
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = `
          <div>Failed to load archive: ${error.message}</div>
          <div class="manual-input">
            <h3>Manual Load</h3>
            <p>Enter either a manifest TXID or metadata.json TXID to load the archive:</p>
            <div class="input-group">
              <label for="manifest-txid">Manifest TXID (or metadata.json TXID):</label>
              <input type="text" id="manifest-txid" placeholder="e.g. ABC123..." maxlength="43" pattern="[A-Za-z0-9_-]{43}" value="${txId}">
            </div>
            <button class="load-button" id="load-button" onclick="loadFromTxId()">Load Archive</button>
          </div>
        `;
      } finally {
        loadButton.disabled = false;
        loadButton.textContent = 'Load Archive';
      }
    }
    
    // Allow Enter key to trigger load
    document.addEventListener('DOMContentLoaded', () => {
      // Initial load
      loadArchive();
      
      // Add Enter key handler for manual input
      const txIdInput = document.getElementById('manifest-txid');
      if (txIdInput) {
        txIdInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            loadFromTxId();
          }
        });
      }
    });
  </script>
</body>
</html>
